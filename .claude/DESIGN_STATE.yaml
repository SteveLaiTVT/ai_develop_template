  user_personas: []
    # Example:
    # - name: "Busy Professional"
    #   description: "Uses app during commute, needs quick actions"
    #   priority: "primary"

  technical_context:
    user_stack_preference:
      frontend: null             # User's preferred frontend stack
      backend: null              # User's preferred backend stack
      familiar_with: []          # Technologies user knows
    existing_resources:
      has_designer: false
      has_brand_guidelines: false
      existing_codebase: false
      apis_to_integrate: []
    infrastructure_preference: null  # vercel | aws | gcp | self-hosted
    team_size: "solo"               # solo | small | medium | large

  product_vision:
    core_problem: null           # What problem does this solve?
    mvp_scope: null              # Minimum viable product definition
    design_style: null           # minimal | playful | corporate | custom
    reference_apps: []           # Apps user likes for inspiration

  constraints:
    budget: null                 # low | medium | flexible
    compliance: []               # GDPR, HIPAA, etc.
    integrations: []             # Existing systems to integrate with

  raw_answers: []                # Store original Q&A for reference

# ============================================================
# 0.7 Deployment Readiness (Defined by A Session)
# ============================================================
deployment:
  minimum_target: "docker"   # docker | none
  preferred_target: "vercel" # vercel | cloud_run | aws | none
  notes:
    - "Provide Dockerfile/compose for minimal deployment."
    - "If frontend exists, document Vercel deployment steps."
    - "List required environment variables for each runtime."

# ============================================================
# 1. Technical Architecture
# ============================================================
architecture:
  pattern: "Layered Architecture + Modular"
  selection_principles:
    - "Honor the user's stated stack preference."
    - "If the user says 'recommend', propose 1-2 viable stacks with rationale."
    - "Prefer latest stable/LTS versions and official best practices."
    - "Record the decision in this file once agreed."
  
  backend:
    language: null         # Examples: "TypeScript", "Python", "Go", "Rust"
    framework: null        # Examples: "NestJS", "Express", "FastAPI", "Django"
    database: null         # Examples: "PostgreSQL", "MySQL", "MongoDB"
    cache: null            # Examples: "Redis", "Memcached", null
    orm: null              # Examples: "Prisma", "TypeORM", "SQLAlchemy"

  frontend_shared:
    language: null         # Examples: "TypeScript", "JavaScript"
    ui_framework: null     # Examples: "React 18", "Vue 3", "Svelte", "Angular"
    state_management: null # Examples: "Zustand", "Redux", "Pinia", "Jotai"
    styling: null          # Examples: "Tailwind CSS", "CSS Modules", "Styled Components"
    api_client: null       # Examples: "TanStack Query + Axios", "SWR", "RTK Query"

  admin_web:
    base: null             # Usually "frontend_shared"
    routing: null          # Examples: "React Router", "Next.js Router"
    ui_library: null       # Examples: "Ant Design", "Material-UI", "Chakra UI"

  user_web:
    base: null             # Usually "frontend_shared"
    routing: null          # Examples: "React Router", "Next.js Router"
    ui_library: null       # Examples: "shadcn/ui", "Material-UI", "Radix UI"
    responsive: null       # true | false
    breakpoints: null      # Examples: {mobile: "< 768px", tablet: "768-1024px", desktop: "> 1024px"}

  mobile:
    android:
      language: null       # Examples: "Kotlin", "Java"
      ui: null             # Examples: "Jetpack Compose", "XML Views"
      architecture: null   # Examples: "MVVM + Clean Architecture", "MVI"
      di: null             # Examples: "Hilt", "Koin", "Dagger"
      networking: null     # Examples: "Retrofit + OkHttp", "Ktor Client"
    ios:
      status: "planned"
      language: null       # Examples: "Swift", "Objective-C"
      ui: null             # Examples: "SwiftUI", "UIKit"

