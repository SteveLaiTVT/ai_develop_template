# ============================================================
# 3. API Design Constraints
# ============================================================
api_constraints:
  style: "RESTful"
  versioning: "URL prefix (/api/v1)"
  
  naming:
    - "Use plural for resource names: /users, /posts"
    - "Use kebab-case: /user-profiles"
    - "Max 2 levels of nesting: /users/{id}/posts"
    
  response_format:
    success: |
      {
        "success": true,
        "data": { ... },
        "meta": { "page": 1, "total": 100 }
      }
    error: |
      {
        "success": false,
        "error": {
          "code": "AUTH_001",
          "message": "Token expired",
          "details": { ... }
        }
      }
      
  authentication:
    method: "Bearer Token (JWT)"
    header: "Authorization: Bearer <token>"
    refresh_strategy: "Refresh Token Rotation"

# ============================================================
# 4. Code Constraints (For B/C Session validation)
# ============================================================
code_constraints:
  general:
    - "No `any` type allowed (TypeScript)"
    - "All functions must have return type declaration"
    - "Single file < 300 lines"
    - "Single function < 50 lines"
    
  backend:
    - "Controller only does parameter validation and calls Service"
    - "Service contains business logic, does not directly access database"
    - "Repository handles database operations"
    - "All database operations must be in transactions"
    - "Sensitive operations must be logged"
    - "DTOs and response schemas must match documented API contracts"
    - "Error responses must follow api_constraints.response_format.error"
    
  frontend:
    - "Use functional components + Hooks"
    - "Extract business logic to custom hooks"
    - "Separate UI components from business components"
    - "All API calls through api-client package"
    - "Network failures must show user-friendly error messages with next steps"
    
  mobile:
    - "Separate UI from business logic (Compose + ViewModel)"
    - "Use StateFlow/SharedFlow for state management"
    - "Network requests through Repository layer"
    - "Network failures must show user-friendly error messages with next steps"

# ============================================================
# 4.5 Testing Strategy (Progressive Approach)
# ============================================================
testing_strategy:
  philosophy: "Test what matters NOW, add comprehensive testing as the project matures"
  documentation: ".claude/templates/progressive_testing.md"

  levels:
    level_1_self_test:
      name: "Self-Test"
      required: true  # ALWAYS required
      description: "Run the code, verify it works as expected"
      backend_checklist:
        - "Server starts without errors"
        - "API endpoints respond correctly (test with curl)"
        - "Database operations work"
        - "Error cases return proper codes"
        - "Invalid/edge-case inputs return friendly error payloads"
      frontend_checklist:
        - "Dev server starts without build errors"
        - "Main pages load (no console errors)"
        - "Frontend flow validated via MCP/agent-based testing"

    level_2_unit_tests:
      name: "Unit Tests"
      required: false  # Recommended, not mandatory
      when_to_add:
        - "Critical security logic (password hashing, tokens)"
        - "Complex business rules"
        - "After fixing bugs (regression prevention)"
        - "When requirements stabilize"
      coverage_target: "80% for stable features"

    level_3_e2e_tests:
      name: "E2E/Integration Tests"
      required: false  # Mature stage only
      when_to_add:
        - "Feature requirements are stable"
        - "Core functionality is complete"
        - "Preparing for production release"
      note: "Not required for initial implementation - add when project matures"

  frontend_testing_options:
    - option: "quick_smoke_test"
      description: "Start server, verify no errors, main elements render"
      recommended_for: "Early stage, rapid development"
    - option: "mcp_agent_test"
