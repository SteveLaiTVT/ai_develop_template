# ============================================================
# DESIGN_STATE - Single Source of Truth
# ============================================================
# Rules:
#   - Only A Session (Opus) can modify this file
#   - Must update version and updated_at on every change
#   - B/C Sessions can only read, not modify
#   - All design decisions must be recorded here
# ============================================================

meta:
  version: "0.2.0"
  updated_at: "2026-01-15"
  updated_by: "A Session"
  project_name: "Your Project Name"
  description: "Brief project description with OpenSpec integration"

# ============================================================
# 0. Workflow State (For Session Status Display)
# ============================================================
workflow_state:
  current_phase: "discovery"  # discovery | design | implementation | review | completed

  discovery:
    status: "pending"  # pending | in_progress | completed
    completed_at: null

  sessions:
    a_session:
      status: "pending"  # pending | active | waiting | completed
      last_action: null
      last_action_at: null
      pending_tasks: []

    b_session:
      status: "pending"
      last_action: null
      last_action_at: null
      pending_tasks: []
      blocked_by_env: false
      missing_env_vars: []

    c_session:
      status: "pending"
      last_action: null
      last_action_at: null
      pending_tasks: []

  next_action:
    session: "A"
    action: "Run discovery interview"
    description: "A Session should ask user questions to understand project requirements"

# ============================================================
# 0.5 Project Analysis (Auto-detected by A Session)
# ============================================================
project_analysis:
  has_frontend: false      # Auto-detected: web frontend exists
  has_backend: false       # Auto-detected: backend service exists
  has_mobile: false        # Auto-detected: mobile app exists

  detected_stack:
    frontend: null         # react | vue | angular | svelte | null
    backend: null          # nestjs | express | fastapi | null
    database: null         # postgresql | mysql | mongodb | null

  required_env:            # Environment variables needed to run
    # Example:
    # - name: "DATABASE_URL"
    #   description: "PostgreSQL connection string"
    #   required_by: "backend"
    #   example: "postgresql://user:pass@localhost:5432/db"
    []

# ============================================================
# 0.6 Discovery Results (Populated by A Session)
# ============================================================
discovery:
  completed: false
  completed_at: null

  target_audience:
    age_range: null              # e.g., "18-35", "all ages"
    tech_level: null             # low | moderate | high
    primary_device: null         # mobile-first | desktop-first | both
    accessibility_needs: []      # color-blind, screen-reader, etc.
    locale: null                 # Primary language/region

  user_personas: []
    # Example:
    # - name: "Busy Professional"
    #   description: "Uses app during commute, needs quick actions"
    #   priority: "primary"

  technical_context:
    user_stack_preference:
      frontend: null             # User's preferred frontend stack
      backend: null              # User's preferred backend stack
      familiar_with: []          # Technologies user knows
    existing_resources:
      has_designer: false
      has_brand_guidelines: false
      existing_codebase: false
      apis_to_integrate: []
    infrastructure_preference: null  # vercel | aws | gcp | self-hosted
    team_size: "solo"               # solo | small | medium | large

  product_vision:
    core_problem: null           # What problem does this solve?
    mvp_scope: null              # Minimum viable product definition
    design_style: null           # minimal | playful | corporate | custom
    reference_apps: []           # Apps user likes for inspiration

  constraints:
    budget: null                 # low | medium | flexible
    compliance: []               # GDPR, HIPAA, etc.
    integrations: []             # Existing systems to integrate with

  raw_answers: []                # Store original Q&A for reference

# ============================================================
# 1. Technical Architecture
# ============================================================
architecture:
  pattern: "Layered Architecture + Modular"
  
  backend:
    language: "TypeScript"
    framework: "NestJS"
    database: "PostgreSQL"
    cache: "Redis"
    orm: "Prisma"
    
  frontend_shared:
    language: "TypeScript"
    ui_framework: "React 18"
    state_management: "Zustand"
    styling: "Tailwind CSS"
    api_client: "TanStack Query + Axios"
    
  admin_web:
    base: "frontend_shared"
    routing: "React Router"
    ui_library: "Ant Design"
    
  user_web:
    base: "frontend_shared"
    routing: "React Router"
    ui_library: "shadcn/ui"
    responsive: true
    breakpoints:
      mobile: "< 768px"
      tablet: "768px - 1024px"
      desktop: "> 1024px"
    
  mobile:
    android:
      language: "Kotlin"
      ui: "Jetpack Compose"
      architecture: "MVVM + Clean Architecture"
      di: "Hilt"
      networking: "Retrofit + OkHttp"
    ios:
      status: "planned"
      language: "Swift"
      ui: "SwiftUI"

# ============================================================
# 2. Business Modules
# ============================================================
modules:
  auth:
    status: "designing"  # designing | in_progress | done | blocked
    owner: "A Session"
    description: "User authentication and authorization"
    features:
      - name: "Email/Password Login"
        priority: "P0"
        status: "pending"
      - name: "JWT Token Management"
        priority: "P0"
        status: "pending"
      - name: "OAuth (Google/Apple)"
        priority: "P1"
        status: "pending"
      - name: "Role-Based Access Control (RBAC)"
        priority: "P0"
        status: "pending"
    
  user:
    status: "pending"
    owner: null
    description: "User management"
    features:
      - name: "User CRUD"
        priority: "P0"
        status: "pending"
      - name: "Profile editing"
        priority: "P1"
        status: "pending"

# ============================================================
# 3. API Design Constraints
# ============================================================
api_constraints:
  style: "RESTful"
  versioning: "URL prefix (/api/v1)"
  
  naming:
    - "Use plural for resource names: /users, /posts"
    - "Use kebab-case: /user-profiles"
    - "Max 2 levels of nesting: /users/{id}/posts"
    
  response_format:
    success: |
      {
        "success": true,
        "data": { ... },
        "meta": { "page": 1, "total": 100 }
      }
    error: |
      {
        "success": false,
        "error": {
          "code": "AUTH_001",
          "message": "Token expired",
          "details": { ... }
        }
      }
      
  authentication:
    method: "Bearer Token (JWT)"
    header: "Authorization: Bearer <token>"
    refresh_strategy: "Refresh Token Rotation"

# ============================================================
# 4. Code Constraints (For B/C Session validation)
# ============================================================
code_constraints:
  general:
    - "No `any` type allowed (TypeScript)"
    - "All functions must have return type declaration"
    - "Single file < 300 lines"
    - "Single function < 50 lines"
    
  backend:
    - "Controller only does parameter validation and calls Service"
    - "Service contains business logic, does not directly access database"
    - "Repository handles database operations"
    - "All database operations must be in transactions"
    - "Sensitive operations must be logged"
    
  frontend:
    - "Use functional components + Hooks"
    - "Extract business logic to custom hooks"
    - "Separate UI components from business components"
    - "All API calls through api-client package"
    
  mobile:
    - "Separate UI from business logic (Compose + ViewModel)"
    - "Use StateFlow/SharedFlow for state management"
    - "Network requests through Repository layer"

# ============================================================
# 5. Current Iteration
# ============================================================
current_iteration:
  id: "iter-001"
  goal: "Complete user authentication MVP"
  started_at: "2026-01-14"
  
  tasks:
    - id: "TASK-001"
      title: "Backend: Auth module base structure"
      assigned_to: "B Session"
      status: "pending"  # pending | in_progress | review | done | blocked
      acceptance_criteria:
        - "POST /api/v1/auth/register available"
        - "POST /api/v1/auth/login available"
        - "Password encrypted with bcrypt"
      files_to_create:
        - "apps/backend/src/modules/auth/auth.controller.ts"
        - "apps/backend/src/modules/auth/auth.service.ts"
        - "apps/backend/src/modules/auth/auth.repository.ts"
        - "apps/backend/src/modules/auth/dto/*.ts"
        
  blocked_tasks: []
  completed_tasks: []

# ============================================================
# 6. Pending Decisions
# ============================================================
pending_decisions:
  - id: "PD-001"
    topic: "File upload storage solution"
    options:
      - "Local storage + Nginx proxy"
      - "AWS S3"
      - "Cloudflare R2"
    deadline: "iter-002"

# ============================================================
# 7. Architecture Decision Records (ADR Log)
# ============================================================
decision_log:
  - id: "ADR-001"
    date: "2026-01-14"
    decision: "Use Monorepo structure"
    rationale: "Easier type sharing, better AI context understanding"
    
  - id: "ADR-002"
    date: "2026-01-14"
    decision: "Backend uses NestJS"
    rationale: "Modular design, native TypeScript support, easy type sharing with frontend"

  - id: "ADR-003"
    date: "2026-01-15"
    decision: "Integrate OpenSpec for spec-driven development"
    rationale: "Provides structured specification management complementing DESIGN_STATE.yaml. Enables detailed API contracts, task breakdowns, and acceptance criteria. Improves AI collaboration with explicit specs before implementation."

# ============================================================
# 8. OpenSpec Integration (Spec-Driven Development)
# ============================================================
openspec:
  enabled: true
  version: "1.0.0"
  description: "OpenSpec provides detailed specifications complementing DESIGN_STATE.yaml"

  structure:
    specs_dir: "openspec/specs/"        # Completed specifications (archived)
    changes_dir: "openspec/changes/"    # Active change proposals
    agents_file: "openspec/AGENTS.md"   # AI tool instructions

  workflow:
    - step: "A Session creates OpenSpec change proposal"
      description: "Detailed API contracts, tasks, acceptance criteria"
    - step: "Human + A Session review and refine"
      description: "Iterate on specification until approved"
    - step: "B Session implements per specification"
      description: "Code according to OpenSpec docs"
    - step: "C Session validates against specification"
      description: "Check implementation matches spec"
    - step: "Archive completed change to specs/"
      description: "Move from changes/ to specs/ when done"

  integration_with_design_state:
    design_state_provides:
      - "High-level architecture"
      - "Technology stack decisions"
      - "Code constraints and standards"
      - "Module dependencies"
      - "Current iteration status"

    openspec_provides:
      - "Detailed API specifications"
      - "Implementation task breakdowns"
      - "Acceptance testing criteria"
      - "Feature-specific requirements"
      - "Technical implementation details"

  usage_examples:
    - name: "example-auth-api"
      location: "openspec/specs/example-auth-api/"
      status: "completed"
      description: "Authentication API with registration, login, refresh"

  active_changes: []
    # Example:
    # - name: "add-user-profile"
    #   created: "2026-01-15"
    #   owner: "A Session"
    #   status: "in_progress"
    #   location: "openspec/changes/add-user-profile/"

# ============================================================
# 9. Review History (Recorded by A Session)
# ============================================================
review_history: []
  # Example:
  # - iteration: "iter-001"
  #   task: "TASK-001"
  #   reviewer: "C Session"
  #   issues_found:
  #     - type: "constraint_violation"
  #       description: "Service directly called Prisma"
  #       resolution: "Extract to Repository"
  #   resolved_in_version: "0.1.1"

# ============================================================
# 10. Claude Cowork Integration (Optional)
# ============================================================
cowork:
  enabled: false  # Set to true when using Claude Cowork
  description: "Claude Cowork brings agentic capabilities to non-developers through Claude Desktop"

  # Detection: How to know if running in Cowork
  detection:
    # Check if running in Cowork environment
    # - Cowork runs in a sandboxed Linux VM via Apple Virtualization Framework
    # - Has file system access only to explicitly granted folders
    environment_hints:
      - "Running in Claude Desktop macOS app"
      - "User granted folder access via Cowork UI"
      - "May have browser extension enabled for web navigation"

  # Capabilities available when using Cowork
  capabilities:
    file_access:
      enabled: false
      granted_folders: []  # Folders user has granted access to
      # Example: ["/Users/name/Projects/my-app"]

    browser_navigation:
      enabled: false  # Requires Claude Chrome extension
      description: "Navigate websites and interact with web UIs"

    connectors:
      enabled: false
      available: []  # Third-party integrations
      # Examples: ["canva", "asana", "notion", "paypal"]

  # How Cowork integrates with the three-session workflow
  workflow_integration:
    # A Session (Architect) benefits
    a_session:
      - "Can browse reference apps for design inspiration"
      - "Can access project management tools (Asana, Notion) for requirements"
      - "Can view design files in Canva for brand guidelines"

    # B Session (Implementer) benefits
    b_session:
      - "Enhanced file editing without terminal complexity"
      - "Browser-based frontend testing with visual feedback"
      - "Access to documentation sites for API references"

    # C Session (Reviewer) benefits
    c_session:
      - "Visual inspection of frontend implementations"
      - "Access to issue trackers for bug reporting"
      - "Can compare against design mockups"

  # User onboarding for Cowork
  onboarding:
    prerequisites:
      - "Claude Max subscription ($100-200/month)"
      - "macOS with Claude Desktop app"
      - "Optional: Claude Chrome extension for browser features"

    setup_steps:
      - step: 1
        action: "Open Claude Desktop app on macOS"
        description: "Launch the Claude app from Applications"

      - step: 2
        action: "Enable Cowork feature"
        description: "Look for Cowork option in settings or main interface"

      - step: 3
        action: "Grant folder access"
        description: "Select project folder to allow Claude to read/edit files"

      - step: 4
        action: "Optional: Install Chrome extension"
        description: "Enables browser navigation capabilities"

      - step: 5
        action: "Optional: Connect third-party apps"
        description: "Use Connectors to link Asana, Notion, Canva, etc."

  # Safety and security notes
  security:
    sandboxing: "Cowork runs in isolated Linux VM via Apple Virtualization Framework"
    file_access: "Claude can only access explicitly granted folders"
    warnings:
      - "Claude can take potentially destructive actions (deleting files)"
      - "Always review changes before approving"
      - "Consider using version control (git) as a safety net"
    recommendations:
      - "Grant access only to project folders, not entire home directory"
      - "Keep version control enabled for easy rollback"
      - "Review Claude's proposed changes before confirming"

  # Current session info (filled at runtime)
  current_session:
    is_cowork: false  # Detected at session start
    granted_folders: []
    active_connectors: []
    browser_enabled: false
