  completed: false
  completed_at: null

  target_audience:
    age_range: null              # e.g., "18-35", "all ages"
    tech_level: null             # low | moderate | high
    primary_device: null         # mobile-first | desktop-first | both
    accessibility_needs: []      # color-blind, screen-reader, etc.
