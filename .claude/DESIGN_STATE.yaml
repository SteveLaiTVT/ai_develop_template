# ============================================================
# 0.7 Deployment Readiness (Defined by A Session)
# ============================================================
deployment:
  minimum_target: "docker"   # docker | none
  preferred_target: "vercel" # vercel | cloud_run | aws | none
  notes:
    - "Provide Dockerfile/compose for minimal deployment."
    - "If frontend exists, document Vercel deployment steps."
    - "List required environment variables for each runtime."

