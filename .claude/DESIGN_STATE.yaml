# ============================================================
# 8. OpenSpec Integration (Spec-Driven Development)
# ============================================================
openspec:
  enabled: true
  version: "1.0.0"
  description: "OpenSpec provides detailed specifications complementing DESIGN_STATE.yaml"

  structure:
    specs_dir: "openspec/specs/"        # Completed specifications (archived)
    changes_dir: "openspec/changes/"    # Active change proposals
    agents_file: "openspec/AGENTS.md"   # AI tool instructions

  workflow:
    - step: "A Session creates OpenSpec change proposal"
      description: "Detailed API contracts, tasks, acceptance criteria"
    - step: "Human + A Session review and refine"
      description: "Iterate on specification until approved"
    - step: "B Session implements per specification"
      description: "Code according to OpenSpec docs"
    - step: "C Session validates against specification"
      description: "Check implementation matches spec"
    - step: "Archive completed change to specs/"
      description: "Move from changes/ to specs/ when done"

  integration_with_design_state:
    design_state_provides:
      - "High-level architecture"
      - "Technology stack decisions"
      - "Code constraints and standards"
      - "Module dependencies"
      - "Current iteration status"

    openspec_provides:
      - "Detailed API specifications"
      - "Implementation task breakdowns"
      - "Acceptance testing criteria"
      - "Feature-specific requirements"
      - "Technical implementation details"

  usage_examples:
    - name: "example-auth-api"
      location: "openspec/specs/example-auth-api/"
      status: "completed"
      description: "Authentication API with registration, login, refresh"

  active_changes: []
    # Example:
    # - name: "add-user-profile"
    #   created: "2026-01-15"
    #   owner: "A Session"
    #   status: "in_progress"
    #   location: "openspec/changes/add-user-profile/"

