# ============================================================
# DESIGN_STATE - Single Source of Truth
# ============================================================
# Rules:
#   - Only A Session (Architect) can modify this file
#   - Must update version and updated_at on every change
#   - B/C Sessions can only read, not modify
#   - All design decisions must be recorded here
# ============================================================

meta:
  version: "0.3.0"
  updated_at: "2026-01-16"
  updated_by: "A Session"
  project_name: "Your Project Name"
  description: "Brief project description with OpenSpec integration and progressive testing"

# ============================================================
# -1. Project Initialization (First-time Setup)
# ============================================================
# When this template is first loaded, the assistant should:
# 1. Detect this is a fresh template (is_template: true)
# 2. Ask user onboarding questions
# 3. Initialize the project with user's intent
# 4. Set up local git (remote is optional)
# 5. Launch the A/B/C session workflow
# ============================================================
initialization:
  is_template: true          # Set to false after project is initialized
  initialized: false         # Set to true after initialization complete
  initialized_at: null       # Timestamp when initialized

  # Onboarding questions to ask user
  onboarding:
    completed: false
    answers:
      project_name: null           # What should we call this project?
      project_description: null    # Brief description of what you're building
      project_type: null           # web-app | mobile-app | api-service | full-stack | other
      git_remote: null             # User's git remote URL (OPTIONAL - can be null/skip)
      preferred_stack: null        # User's tech stack preference or "recommend"
      apply_best_practices: null   # true | false | "selective" - Apply tech best practices?
      # Package name for Java/Kotlin/Android projects (required if using these)
      package_name: null           # e.g., "com.example.myapp" - Asked if Java/Kotlin/Android selected

  # Project structure (apps folder layout)
  # All artifacts are placed in {project}/apps/{module}
  project_structure:
    root_folder: "apps"
    modules:
      backend: "apps/backend"           # Spring Boot / NestJS / FastAPI / Ktor
      android: "apps/android"           # Android (Kotlin/Java)
      ios: "apps/ios"                   # iOS (Swift)
      user_web: "apps/user-web"         # User-facing web app (Next.js/Vue)
      admin_web: "apps/admin-web"       # Admin dashboard (Next.js/Vue)
      shared: "apps/shared"             # Shared code (types, utils)
    note: "Use official generators to create projects in these folders"

  # Official project generators
  # Use these to create new projects instead of manual setup
  project_generators:
    spring_boot:
      name: "Spring Initializr"
      url: "https://start.spring.io"
      command: "curl https://start.spring.io/starter.zip -d ... -o backend.zip"
      description: "Official Spring Boot project generator"

    android:
      name: "Android Studio"
      url: "https://developer.android.com/studio"
      description: "Create via Android Studio New Project wizard"

    ios:
      name: "Xcode"
      url: "https://developer.apple.com/xcode/"
      description: "Create via Xcode New Project wizard"

    nextjs:
      name: "create-next-app"
      command: "npx create-next-app@latest apps/user-web"
      url: "https://nextjs.org/docs/getting-started"
      description: "Official Next.js project generator"

    vite_react:
      name: "Vite"
      command: "npm create vite@latest apps/user-web -- --template react-ts"
      url: "https://vitejs.dev/guide/"
      description: "Vite React/Vue project generator"

    flutter:
      name: "Flutter CLI"
      command: "flutter create apps/mobile"
      url: "https://docs.flutter.dev/get-started"
      description: "Official Flutter project generator"

    nestjs:
      name: "Nest CLI"
      command: "npx @nestjs/cli new apps/backend"
      url: "https://docs.nestjs.com/"
      description: "Official NestJS project generator"

    ktor:
      name: "Ktor Project Generator"
      url: "https://start.ktor.io"
      description: "Official Ktor project generator"

    quarkus:
      name: "Quarkus CLI"
      url: "https://code.quarkus.io"
      command: "quarkus create app apps/backend"
      description: "Official Quarkus project generator"

  # Model preferences for each session (model-agnostic)
  model_preferences:
    description: "Configure which model to use for each session"
    a_session: "reasoning"         # reasoning (default) - Architect needs deep reasoning
    b_session: "fast"              # fast (default) | reasoning - Implementer
    c_session: "fast"              # fast (default) | reasoning - Reviewer
    available_models:
      reasoning:
        name: "Reasoning model"
        description: "Best for complex reasoning, architecture, nuanced decisions"
        recommended_for: "A Session (Architect)"
      fast:
        name: "Fast model"
        description: "Efficient for implementation and review"
        recommended_for: "B/C Sessions (Implementer/Reviewer)"

  # Git initialization steps (local-first, remote optional)
  git_setup:
    cleared_template_git: false    # Template's .git folder removed
    created_gitignore: false       # .gitignore file created
    initialized_new_repo: false    # git init completed
    created_main_branch: false     # main branch created
    initial_commit: false          # First commit made with user's intent
    remote_added: false            # git remote add origin (OPTIONAL)
    pushed_to_remote: false        # git push (OPTIONAL, only if remote added)

  # Session launch state
  session_launch:
    a_session_started: false       # A Session (Architect) launched
    b_session_started: false       # B Session (Implementer) launched
    c_session_started: false       # C Session (Reviewer) launched
    parallel_mode: false           # Sessions working in parallel

  # Review and merge workflow (local-first)
  merge_workflow:
    description: "After C Session review passes, merge to main branch locally"
    steps:
      - "B Session creates feature branch and implements"
      - "C Session reviews and approves"
      - "Merge to main branch locally"
      - "Push to remote only when user is ready (optional)"

# ============================================================
# 0. Workflow State (For Session Status Display)
# ============================================================
workflow_state:
  current_phase: "initialization"  # initialization | discovery | design | spec_review | implementation | review | merge | archive | completed

  discovery:
    status: "pending"  # pending | in_progress | completed
    completed_at: null

  # Coordinator manages linear task execution
  coordinator:
    enabled: true
    mode: "linear_sync"            # linear_sync = one task at a time, blocking
    current_task: null             # Current task being executed
    task_queue: []                 # Ordered list of pending tasks
    last_checkpoint: null          # Last saved state for resume
    last_checkpoint_at: null

  sessions:
    a_session:
      status: "pending"  # pending | active | waiting | completed
      last_action: null
      last_action_at: null
      pending_tasks: []

    b_session:
      status: "pending"
      last_action: null
      last_action_at: null
      pending_tasks: []
      blocked_by_env: false
      missing_env_vars: []
      env_check_completed: false   # NEW: Track if .env was checked

    c_session:
      status: "pending"
      last_action: null
      last_action_at: null
      pending_tasks: []

  next_action:
    session: "System"
    action: "Run project initialization"
    description: "First-time setup: ask onboarding questions, configure project, set up git, then launch sessions"

# ============================================================
# 0.5 Project Analysis (Auto-detected by A Session)
# ============================================================
project_analysis:
  has_frontend: false      # Auto-detected: web frontend exists
  has_backend: false       # Auto-detected: backend service exists
  has_mobile: false        # Auto-detected: mobile app exists

  detected_stack:
    frontend: null         # react | vue | angular | svelte | null
    backend: null          # nestjs | express | fastapi | null
    database: null         # postgresql | mysql | mongodb | null

  required_env:            # Environment variables needed to run
    # Example:
    # - name: "DATABASE_URL"
    #   description: "PostgreSQL connection string"
    #   required_by: "backend"
    #   example: "postgresql://user:pass@localhost:5432/db"
    []

