  selection_principles:
    - "Honor the user's stated stack preference."
    - "If the user says 'recommend', propose 1-2 viable stacks with rationale."
    - "Prefer latest stable/LTS versions and official best practices."
    - "Record the decision in this file once agreed."
  
  backend:
    language: null         # Examples: "TypeScript", "Python", "Go", "Rust"
    framework: null        # Examples: "NestJS", "Express", "FastAPI", "Django"
    database: null         # Examples: "PostgreSQL", "MySQL", "MongoDB"
    cache: null            # Examples: "Redis", "Memcached", null
