# ============================================================
# 8. OpenSpec Integration (Spec-Driven Development) - MANDATORY
# ============================================================
# IMPORTANT: OpenSpec is REQUIRED before any implementation.
# The Coordinator enforces this rule.
# ============================================================
openspec:
  enabled: true
  mandatory: true                # NEW: OpenSpec required before implementation
  version: "1.0.0"
  description: "OpenSpec provides detailed specifications - REQUIRED before implementation"

  structure:
    specs_dir: "openspec/specs/"        # Completed specifications (archived)
    changes_dir: "openspec/changes/"    # Active change proposals
    agents_file: "openspec/AGENTS.md"   # AI tool instructions

  # MANDATORY workflow - Coordinator enforces this sequence
  workflow:
    - step: "1. A Session creates OpenSpec"
      description: "Create SPEC.md, TASKS.md, ACCEPTANCE.md in openspec/changes/{feature}/"
      required: true
    - step: "2. User reviews and approves spec"
      description: "User must say 'approve {feature}' before implementation begins"
      required: true
    - step: "3. B Session implements per specification"
      description: "Code ONLY according to OpenSpec - no deviations allowed"
      required: true
    - step: "4. C Session validates against specification"
      description: "Review code against SPEC.md and ACCEPTANCE.md"
      required: true
    - step: "5. Archive completed spec"
      description: "Move from changes/ to specs/ when review passes"
      required: true

  integration_with_design_state:
    design_state_provides:
      - "High-level architecture"
      - "Technology stack decisions"
      - "Code constraints and standards"
      - "Module dependencies"
      - "Current iteration status"

    openspec_provides:
      - "Detailed API specifications"
      - "Implementation task breakdowns"
      - "Acceptance testing criteria"
      - "Feature-specific requirements"
      - "Technical implementation details"

  usage_examples:
    - name: "example-auth-api"
      location: "openspec/specs/example-auth-api/"
      status: "completed"
      description: "Authentication API with registration, login, refresh"

  # Active specs being worked on
  # Status values: drafting | pending_review | approved | implementing | code_review | done
  active_changes: []
    # Example:
    # - name: "add-user-profile"
    #   created_at: "2026-01-23"
    #   owner: "A Session"
    #   status: "drafting"         # drafting | pending_review | approved | implementing | code_review | done
    #   approved_at: null          # Timestamp when user approved
    #   approved_by: null          # "user" or null
    #   location: "openspec/changes/add-user-profile/"
    #   files:
    #     spec: "SPEC.md"
    #     tasks: "TASKS.md"
    #     acceptance: "ACCEPTANCE.md"

